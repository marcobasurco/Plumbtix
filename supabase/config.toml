# =============================================================================
# Work Orders — Supabase Project Configuration
# =============================================================================
# Local development environment. Production linking via `supabase link`.
#
# Migration order:
#   00001 → Section 4 (schema)          🔒 LOCKED
#   00002 → Section 5 (security/RLS)    🔒 LOCKED
#   00003 → Section 6 (storage)         🔒 LOCKED
#   00004 → Section 7 (seed)            🔒 LOCKED
#   00005 → Transition trigger          ✅ ADDITIVE
# =============================================================================

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://workorders.proroto.com", "https://workorders.proroto.com/reset-password"]
# Mirrors production (Dashboard → Authentication → Sign In / Providers → Email).
# Keep in sync with supabase/functions/_shared/validation.ts and src/lib/password.ts.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
# Self-signup is OFF, locally and in production. Every account is created by
# accept-invitation / claim-resident through the Auth admin API, or by hand in
# Studio for the first admin (scripts/bootstrap-first-admin.sql).
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
# Password-reset links: 1 hour is plenty and limits the window if an inbox is
# compromised. Minimum 60 s between resend requests for the same address.
otp_expiry = 3600
max_frequency = "1m0s"

# ---------------------------------------------------------------------------
# Auth emails go through Resend, same sender as the app's own notifications.
# Supabase's built-in mailer allows only a few emails per hour per project —
# the day 150 properties' staff start resetting passwords it would silently
# drop most of them.
#
# Production: push this block with `supabase config push` (CLI ≥ 2.0), or set
# the same values in Dashboard → Authentication → Emails → SMTP Settings.
# RESEND_API_KEY must exist in the shell for `config push` and in
# supabase/.env for local `supabase start`.
# ---------------------------------------------------------------------------
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "notifications@proroto.com"
sender_name = "Pro Roto Work Orders"

# Branded templates (same vocabulary as the app). Variables:
#   {{ .ConfirmationURL }}  the one-time link
#   {{ .SiteURL }}          site_url above
#   {{ .Email }} / {{ .NewEmail }}
[auth.email.template.recovery]
subject = "Reset your Pro Roto Work Orders password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email for Pro Roto Work Orders"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Your sign-in link for Pro Roto Work Orders"
content_path = "./supabase/templates/magic_link.html"

# Unused flows (self-signup is off; invitations are sent by the app through
# send-invitation), kept on-brand in case they are ever turned on.
[auth.email.template.invite]
subject = "You're invited to Pro Roto Work Orders"
content_path = "./supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirm your email for Pro Roto Work Orders"
content_path = "./supabase/templates/confirmation.html"

[auth.external.google]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[realtime]
enabled = true

[analytics]
enabled = false

[edge_runtime]
policy = "oneshot"

# ---------------------------------------------------------------------------
# Edge Functions — JWT Verification
# ---------------------------------------------------------------------------
# Disable Kong's gateway-level JWT verification for ALL functions.
# Each function handles its own auth:
#   - Public functions (accept-invitation, claim-resident): no auth required
#   - Authenticated functions: validate JWT via createUserClient + getAuthenticatedUserId
# Without this, Kong rejects the JWT before the function can run,
# causing persistent "Invalid JWT" errors.
# ---------------------------------------------------------------------------

[functions.accept-invitation]
verify_jwt = false

[functions.claim-resident]
verify_jwt = false

[functions.create-building]
verify_jwt = false

[functions.create-comment]
verify_jwt = false

[functions.create-company]
verify_jwt = false

[functions.create-entitlement]
verify_jwt = false

[functions.create-occupant]
verify_jwt = false

[functions.create-space]
verify_jwt = false

[functions.create-ticket]
verify_jwt = false

[functions.delete-attachment]
verify_jwt = false

[functions.delete-building]
verify_jwt = false

[functions.delete-entitlement]
verify_jwt = false

[functions.delete-invitation]
verify_jwt = false

[functions.delete-occupant]
verify_jwt = false

[functions.delete-space]
verify_jwt = false

[functions.get-ticket-comments]
verify_jwt = false

[functions.register-attachment]
verify_jwt = false

[functions.resend-invitation]
verify_jwt = false

[functions.send-invitation]
verify_jwt = false

[functions.send-sms]
verify_jwt = false

[functions.update-building]
verify_jwt = false

[functions.update-company]
verify_jwt = false

[functions.update-occupant]
verify_jwt = false

[functions.update-space]
verify_jwt = false

[functions.update-ticket]
verify_jwt = false
