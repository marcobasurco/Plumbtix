# =============================================================================
# PlumbTix — CI/CD Pipeline
# =============================================================================
# On PR: lint, typecheck, test, build (+ e2e)
# On merge to main: lint, typecheck, test, build
# Production deploys are handled by Netlify's git integration (frontend)
# and deploy-functions.yml (Supabase edge functions) — NOT by this workflow.
# =============================================================================

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # lint/typecheck output is posted on the PR when it fails
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: |
          set -o pipefail
          npx eslint src/ shared/ 2>&1 | tee lint-output.txt

      - name: Type check
        id: typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-output.txt

      # Raw job logs are not always reachable from where PRs are reviewed, so
      # the first failing step's output goes on the PR as a comment.
      - name: Post lint / typecheck output on the PR
        if: failure() && github.event_name == 'pull_request' && (steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then STEP=Lint; FILE=lint-output.txt; else STEP="Type check"; FILE=typecheck-output.txt; fi
          { echo "### CI: $STEP failed"; echo; echo '```'; tail -c 60000 "$FILE"; echo '```'; } > pr-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file pr-comment.md

      - name: Unit tests
        run: npx vitest run --reporter=verbose

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_EDGE_BASE_URL: https://placeholder.supabase.co/functions/v1

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_EDGE_BASE_URL: ${{ secrets.EDGE_BASE_URL }}